<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Đăng ký - Rental Room</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold"
               th:href="@{/}">
                Rental Room
            </a>

            <div class="d-flex">

                <a class="btn btn-outline-light"
                   th:href="@{/login}">
                    Đăng nhập
                </a>

            </div>

        </div>

    </nav>


    <!-- Register -->
    <div class="container">

        <div class="row justify-content-center mt-5">

            <div class="col-md-7 col-lg-6">

                <div class="card shadow-sm">

                    <div class="card-body p-4">

                        <h3 class="text-center mb-4">
                            Đăng ký tài khoản
                        </h3>


                        <!-- Error -->
                        <div th:if="${error}"
                             class="alert alert-danger"
                             th:text="${error}">
                        </div>


                        <form th:action="@{/register}"
                              th:object="${user}"
                              method="post">


                            <!-- Username -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Username
                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:field="*{username}"
                                       placeholder="Nhập username"
                                       required>

                            </div>


                            <!-- First name -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Họ
                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:field="*{firstName}"
                                       placeholder="Nhập họ"
                                       required>

                            </div>


                            <!-- Last name -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Tên
                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:field="*{lastName}"
                                       placeholder="Nhập tên"
                                       required>

                            </div>


                            <!-- Email -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                       class="form-control"
                                       th:field="*{email}"
                                       placeholder="example@gmail.com"
                                       required>

                            </div>


                            <!-- Phone -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Số điện thoại
                                </label>

                                <input type="tel"
                                       class="form-control"
                                       th:field="*{phone}"
                                       placeholder="Nhập số điện thoại"
                                       required>

                            </div>


                            <!-- Password -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Mật khẩu
                                </label>

                                <input type="password"
                                       class="form-control"
                                       th:field="*{password}"
                                       placeholder="Nhập mật khẩu"
                                       required>

                            </div>


                            <!-- Address -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Địa chỉ
                                </label>

                                <textarea
                                    class="form-control"
                                    th:field="*{address}"
                                    rows="2"
                                    placeholder="Nhập địa chỉ">
                                </textarea>

                            </div>


                            <!-- Submit -->
                            <div class="d-grid">

                                <button type="submit"
                                        class="btn btn-primary">
                                    Đăng ký
                                </button>

                            </div>

                        </form>


                        <div class="text-center mt-3">

                            <span>
                                Đã có tài khoản?
                            </span>

                            <a th:href="@{/login}">
                                Đăng nhập
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
